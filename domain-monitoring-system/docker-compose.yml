services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    image: dms-backend:test
    container_name: dms-backend

    expose:
      - "5001"

    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dms-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    image: dms-frontend:test
    container_name: dms-frontend

    ports:
      - "5000:5000"

    environment:
      SECRET_KEY: ${SECRET_KEY}
      BACKEND_URL: http://backend:5001

    volumes:
      - ./frontend/logs:/app/frontend/logs

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dms-network

networks:
  dms-network:
    driver: bridge
