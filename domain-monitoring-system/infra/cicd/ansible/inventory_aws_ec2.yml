---
plugin: amazon.aws.aws_ec2

regions:
  - eu-central-1

hostnames:
  - tag:Name

compose:
  ansible_host: public_ip_address

groups:
  jenkins_controller: tags.Role == 'jenkins-controller'
  docker_agent: tags.Role == 'docker-agent'
  ansible_agent: tags.Role == 'ansible-agent'
  production: tags.Role == 'production'

filters:
  instance-state-name: running
  tag:Role:
    - jenkins-controller
    - docker-agent
    - ansible-agent
    - production
